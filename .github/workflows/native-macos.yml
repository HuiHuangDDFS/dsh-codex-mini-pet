name: macOS companion
on:
  push:
    branches: [main, 'codex/macos-companion']
    paths: ['native/**', 'scripts/*macos*', 'src/macos-companion.mjs', '.github/workflows/native-macos.yml']
  workflow_dispatch:
jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: node scripts/build-native-macos.mjs
      - run: node scripts/verify-native-macos.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: macos-universal-companion
          path: native/macos/pet-window.gz
